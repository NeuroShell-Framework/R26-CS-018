name: CI Pipeline

on:
  push:
    branches: [main, develop, '**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          pip install poetry

      - name: Install dependencies
        run: |
          poetry install --no-interaction

      - name: Run Ruff linter
        run: |
          poetry run ruff check .

      - name: Run Black format check
        run: |
          poetry run black --check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          pip install poetry

      - name: Install dependencies
        run: |
          poetry install --no-interaction

      - name: Install mypy
        run: |
          pip install mypy

      - name: Run mypy type check
        run: |
          poetry run mypy .
        continue-on-error: true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          pip install poetry

      - name: Install dependencies
        run: |
          poetry install --no-interaction

      - name: Run pytest
        run: |
          poetry run pytest -v

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build adaptive-execution-error-recovery
        uses: docker/build-push-action@v5
        with:
          context: ./apps/services/adaptive-execution-error-recovery
          push: false
          tags: neuroshell-adaptive-error-recovery:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ai-vulnerability-analysis
        uses: docker/build-push-action@v5
        with:
          context: ./apps/services/ai-vulnerability-analysis
          push: false
          tags: neuroshell-ai-vulnerability-analysis:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dynamic-planner-rag
        uses: docker/build-push-action@v5
        with:
          context: ./apps/services/dynamic-planner-rag
          push: false
          tags: neuroshell-dynamic-planner-rag:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build intent-recognition
        uses: docker/build-push-action@v5
        with:
          context: ./apps/services/intent-recognition
          push: false
          tags: neuroshell-intent-recognition:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Bandit security scan
        run: |
          pip install bandit
          bandit -r . -x ./tests,./infra

  build-success:
    name: Build Success
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security-scan]
    if: always()
    steps:
      - name: Check job status
        run: |
          echo "All jobs completed"