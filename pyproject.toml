[tool.poetry]
name = "neuroshell-core"
version = "0.1.0"
description = "NeuroShell Core - Microservices Monorepo"
authors = ["NeuroShell Team <team@neuroshell.ai>"]
readme = "README.md"
packages = [{include = "shared", from = "."}]

[tool.poetry.workspace]
packages = [
    {path = "shared"},
    {path = "apps/services/adaptive-execution-error-recovery"},
    {path = "apps/services/ai-vulnerability-analysis"},
    {path = "apps/services/dynamic-planner-rag"},
    {path = "apps/services/intent-recognition"},
    {path = "apps/api-gateway"},
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
python-multipart = "^0.0.12"
httpx = "^0.27.2"
pyyaml = "^6.0.2"
loguru = "^0.47.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
ruff = "^0.8.0"
black = "^24.10.0"
pre-commit = "^4.0.1"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"